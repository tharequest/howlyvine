name: Deploy to Pinata

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_ADMIN_USERNAME: ${{ secrets.VITE_ADMIN_USERNAME }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}

      - name: Upload to Pinata
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const FormData = require('form-data');

          async function uploadDir(dir) {
            const form = new FormData();
            const files = fs.readdirSync(dir, { recursive: true });
            files.forEach(file => {
              const full = path.join(dir, file);
              if (fs.statSync(full).isFile()) {
                form.append('file', fs.createReadStream(full), {
                  filepath: 'howlyvine/' + file
                });
              }
            });
            form.append('pinataMetadata', JSON.stringify({ name: 'howlyvine' }));

            const res = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ${{ secrets.PINATA_JWT }}',
                ...form.getHeaders()
              },
              body: form
            });
            const data = await res.json();
            console.log('CID:', data.IpfsHash);
            console.log('URL: https://gateway.pinata.cloud/ipfs/' + data.IpfsHash);
          }

          uploadDir('./dist');
          "